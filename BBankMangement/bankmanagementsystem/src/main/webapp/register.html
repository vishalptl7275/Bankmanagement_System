<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bank Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .shape { position: absolute; opacity: 0.1; animation: rotate 20s linear infinite; }
        .shape-1 { top: 10%; left: 10%; width: 80px; height: 80px; background: white; border-radius: 50%; }
        .shape-2 { top: 70%; left: 80%; width: 120px; height: 120px; background: white; border-radius: 20px; animation: rotate 15s linear infinite reverse; }
        .shape-3 { top: 40%; right: 10%; width: 60px; height: 60px; background: white; transform: rotate(45deg); }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .container { position: relative; z-index: 10; width: 100%; max-width: 450px; padding: 20px; }
        .logo-container { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            font-size: 40px; color: white; margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        h1 { color: white; font-size: 28px; font-weight: 600; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2); }
        .card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out 0.2s both;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h2 {
            color: #333; font-size: 24px; margin-bottom: 30px;
            text-align: center; position: relative; padding-bottom: 15px;
        }
        h2::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 60px; height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        .form-group { margin-bottom: 25px; position: relative; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 14px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: #999; font-size: 18px; transition: color 0.3s; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px 15px 14px 45px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1); }
        input:focus ~ .input-icon { color: #667eea; }
        .password-toggle {
            position: absolute; right: 15px; color: #999;
            cursor: pointer; font-size: 18px; transition: color 0.3s;
        }
        .password-toggle:hover { color: #667eea; }
        .error-message {
            background: #fee; color: #c33; padding: 12px;
            border-radius: 8px; margin-bottom: 20px; display: none;
            font-size: 14px; border-left: 4px solid #c33;
        }
        .error-message.show { display: block; animation: shake 0.4s; }
        .success-message {
            background: #e6ffed; color: #1b7a31; padding: 12px;
            border-radius: 8px; margin-bottom: 20px; display: none;
            font-size: 14px; border-left: 4px solid #1b7a31;
        }
        .success-message.show { display: block; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .btn:hover::before { width: 300px; height: 300px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5); }
        .btn:active { transform: translateY(0); }
        .btn-text {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .login-link {
            text-align: center; margin-top: 25px;
            color: #666; font-size: 14px;
        }
        .login-link a {
            color: #667eea; text-decoration: none;
            font-weight: 600; transition: color 0.3s;
        }
        .login-link a:hover { color: #764ba2; text-decoration: underline; }
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .card { padding: 30px 25px; }
            h1 { font-size: 24px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="container">
        <div class="logo-container">
            <div class="logo-icon"><i class="fas fa-university"></i></div>
            <h1>Bank Management System</h1>
        </div>
        <div class="card">
            <h2>Create Admin Account</h2>
            <div class="error-message" id="errorMessage"></div>
            <form id="registerForm" action="register" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password">
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm your password" required autocomplete="new-password">
                        <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">
                        <i class="fas fa-user-plus"></i>
                        <span>Create Account</span>
                    </span>
                </button>
            </form>
            <div class="login-link">
                Already have an account? <a href="login.html">Login Here</a>
            </div>
        </div>
    </div>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const password = document.getElementById('confirmPassword');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Show error messages
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const errorDiv = document.getElementById('errorMessage');
            
            if (urlParams.has('error')) {
                errorDiv.classList.add('show');
                const errorType = urlParams.get('error');
                
                switch(errorType) {
                    case 'empty':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> All fields are required';
                        break;
                    case 'mismatch':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Passwords do not match';
                        break;
                    case 'short_password':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Password must be at least 6 characters';
                        break;
                    case 'short_username':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Username must be at least 3 characters';
                        break;
                    case 'duplicate':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Username already exists';
                        break;
                    case 'db':
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Database error occurred';
                        break;
                    default:
                        errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Registration failed';
                }
            }
        });

        // Client-side validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            if (password !== confirmPassword) {
                e.preventDefault();
                errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Passwords do not match';
                errorDiv.classList.add('show');
                return false;
            }

            if (password.length < 6) {
                e.preventDefault();
                errorDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Password must be at least 6 characters';
                errorDiv.classList.add('show');
                return false;
            }
        });
    </script>
</body>
</html>
