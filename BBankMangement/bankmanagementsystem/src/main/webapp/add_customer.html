<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - Bank Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Pattern */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Floating Shapes */
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: rotate 20s linear infinite;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
        }

        .shape-2 {
            top: 70%;
            left: 80%;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 20px;
            animation: rotate 15s linear infinite reverse;
        }

        .shape-3 {
            top: 40%;
            right: 10%;
            width: 60px;
            height: 60px;
            background: white;
            transform: rotate(45deg);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: white;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.6s ease-out;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            transition: background 0.3s, transform 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            padding-bottom: 12px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #999;
            font-size: 16px;
            transition: color 0.3s;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
            color: #333;
        }

        textarea {
            padding-left: 12px;
            min-height: 60px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .input-wrapper:focus-within .input-icon {
            color: #667eea;
        }

        .message {
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #e6ffed;
            color: #1b7a31;
            border-left: 4px solid #1b7a31;
        }

        .message.error {
            background: #ffe6e6;
            color: #b40000;
            border-left: 4px solid #b40000;
        }

        .btn {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="container">
        <div class="top-bar">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-university"></i>
                </div>
                <div class="logo-text">Bank Management System</div>
            </div>
            <button class="back-btn" onclick="window.location.href='Dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
        </div>

        <div class="card">
            <h2>Add New Customer</h2>
            <p class="subtitle">Fill in the details below to create a new bank account</p>

            <div id="msgBox" class="message"></div>

            <form id="addCustomerForm" method="post" action="addCustomer">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="accountNumber">Account Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-hashtag input-icon"></i>
                            <input type="text" id="accountNumber" name="account_number" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name">Customer Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" name="name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="text" id="phone" name="phone">
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" placeholder="House no, street, city, state"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pin">PIN (4 digits)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="pin" name="pin" maxlength="4" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <div class="input-wrapper">
                            <i class="fas fa-wallet input-icon"></i>
                            <select id="accountType" name="account_type">
                                <option value="Savings">Savings</option>
                                <option value="Current">Current</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="balance">Initial Balance</label>
                        <div class="input-wrapper">
                            <i class="fas fa-rupee-sign input-icon"></i>
                            <input type="number" id="balance" name="balance" min="0" step="0.01" value="0">
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn">
                    <span class="btn-text">
                        <i class="fas fa-save"></i>
                        <span>Create Account</span>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // PIN validation
        document.getElementById('addCustomerForm').addEventListener('submit', function (e) {
            const pin = document.getElementById('pin').value.trim();
            const msgBox = document.getElementById('msgBox');

            if (!/^[0-9]{4}$/.test(pin)) {
                e.preventDefault();
                msgBox.className = 'message error';
                msgBox.textContent = 'PIN must be exactly 4 digits.';
                msgBox.style.display = 'block';
                return;
            }
        });

        // Show success/error from backend using ?success=1 or ?error=...
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const box = document.getElementById('msgBox');

            if (params.get('success') === '1') {
                box.className = 'message success';
                box.textContent = 'Customer created successfully.';
                box.style.display = 'block';
            } else if (params.get('error')) {
                box.className = 'message error';
                box.style.display = 'block';

                const errorType = params.get('error');
                switch (errorType) {
                    case 'empty':
                        box.textContent = 'All fields are required.';
                        break;
                    case 'invalid_account':
                        box.textContent = 'Account number must be 8-16 digits.';
                        break;
                    case 'invalid_email':
                        box.textContent = 'Invalid email format.';
                        break;
                    case 'invalid_phone':
                        box.textContent = 'Phone number must be exactly 10 digits.';
                        break;
                    case 'invalid_pin':
                        box.textContent = 'PIN must be 4-6 digits.';
                        break;
                    case 'negative_balance':
                        box.textContent = 'Balance cannot be negative.';
                        break;
                    case 'invalid_balance':
                        box.textContent = 'Invalid balance amount.';
                        break;
                    case 'duplicate':
                        box.textContent = 'Account number already exists.';
                        break;
                    case 'db':
                        box.textContent = 'Database error occurred. Please try again.';
                        break;
                    default:
                        box.textContent = 'Error creating customer. Please try again.';
                }
            }
        });
    </script>
</body>

</html>
