<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Customer - Bank Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: rotate 20s linear infinite;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
        }

        .shape-2 {
            top: 70%;
            left: 80%;
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 20px;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: white;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
            transition: background 0.3s, transform 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
            position: relative;
            padding-bottom: 12px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #999;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .message {
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #ffe6e6;
            color: #b40000;
            border-left: 4px solid #b40000;
        }

        .btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Customer Details Card */
        #customerDetails {
            display: none;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .detail-value {
            color: #333;
            font-size: 14px;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .balance-highlight {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-savings {
            background: #e6f4ff;
            color: #0066cc;
        }

        .badge-current {
            background: #fff4e6;
            color: #cc8800;
        }

        @media (max-width: 640px) {
            .container {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="container">
        <div class="top-bar">
            <div class="logo-container">
                <div class="logo-icon"><i class="fas fa-university"></i></div>
                <div class="logo-text">Bank Management System</div>
            </div>
            <button class="back-btn" onclick="window.location.href='Dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>

        <!-- Search Card -->
        <div class="card">
            <h2>Search Customer</h2>
            <p class="subtitle">Enter account number to view details</p>
            <div id="msgBox" class="message"></div>
            <form id="searchForm" method="post" action="viewCustomer">
                <div class="form-group">
                    <label for="accNo">Account Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-search input-icon"></i>
                        <input type="text" id="accNo" name="account_number" required>
                    </div>
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">
                        <i class="fas fa-search"></i>
                        <span>Search</span>
                    </span>
                </button>
            </form>
        </div>

        <!-- Customer Details Card (shown after search) -->
        <div class="card" id="customerDetails">
            <h2>Customer Details</h2>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-hashtag"></i> Account Number</span>
                <span class="detail-value" id="dispAccNo">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-user"></i> Name</span>
                <span class="detail-value" id="dispName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-envelope"></i> Email</span>
                <span class="detail-value" id="dispEmail">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-phone"></i> Phone</span>
                <span class="detail-value" id="dispPhone">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-map-marker-alt"></i> Address</span>
                <span class="detail-value" id="dispAddress">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-wallet"></i> Account Type</span>
                <span class="detail-value" id="dispType">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label"><i class="fas fa-rupee-sign"></i> Balance</span>
                <span class="detail-value balance-highlight" id="dispBalance">₹0.00</span>
            </div>
        </div>
    </div>
    <script>
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const msgBox = document.getElementById('msgBox');
            const detailsCard = document.getElementById('customerDetails');

            if (params.get('success') === '1') {
                // Show customer details
                document.getElementById('dispAccNo').textContent = params.get('accNo') || '-';
                document.getElementById('dispName').textContent = decodeURIComponent(params.get('name') || '-');
                document.getElementById('dispEmail').textContent = decodeURIComponent(params.get('email') || '-');
                document.getElementById('dispPhone').textContent = params.get('phone') || '-';
                document.getElementById('dispAddress').textContent = decodeURIComponent(params.get('address') || '-');

                const accountType = decodeURIComponent(params.get('type') || 'Savings');
                const typeSpan = document.getElementById('dispType');
                typeSpan.innerHTML = '<span class="badge badge-' + accountType.toLowerCase() + '">' + accountType + '</span>';

                const balance = parseFloat(params.get('balance') || 0);
                document.getElementById('dispBalance').textContent = '₹' + balance.toFixed(2);

                detailsCard.style.display = 'block';
            } else if (params.get('error')) {
                msgBox.className = 'message error';
                msgBox.style.display = 'block';
                msgBox.textContent = params.get('error') === 'notfound' ?
                    'Customer not found. Please check the account number.' :
                    'Error occurred while searching.';
            }
        });
    </script>
</body>

</html>
